<h2>Register</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
    <p>Already have an account?</p>
<a href="{% url 'login' %}">Login here</a>
</form>

{% for message in messages %}
<div class="alert alert-{{ message.tags }}">
    {{ message }}
</div>
{% endfor %}
